<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f7f8fa">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: https: http:; media-src 'self' blob: https: http:; connect-src 'self' https:; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Meu Work OS</title>
  <link rel="stylesheet" href="estilos.css">
  <script defer src="vendor/supabase.min.js"></script>
  <script defer src="supabase-storage.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
<svg class="svg-library" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
  <symbol id="i-logo" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="m8 12 2.5 2.5L16 9"/></symbol>
  <symbol id="i-board" viewBox="0 0 24 24"><rect x="3" y="4" width="7" height="16" rx="1.5"/><rect x="14" y="4" width="7" height="16" rx="1.5"/></symbol>
  <symbol id="i-list" viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/></symbol>
  <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4m10-4v4M3 10h18"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/></symbol>
  <symbol id="i-sync" viewBox="0 0 24 24"><path d="M20 8a8.5 8.5 0 0 0-14-2L3 9m0-5v5h5M4 16a8.5 8.5 0 0 0 14 2l3-3m0 5v-5h-5"/></symbol>
  <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12m-4-4 4 4 4-4M4 16v4h16v-4"/></symbol>
  <symbol id="i-up" viewBox="0 0 24 24"><path d="M12 15V3M8 7l4-4 4 4M4 16v4h16v-4"/></symbol>
  <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></symbol>
  <symbol id="i-edit" viewBox="0 0 24 24"><path d="m14 6 4 4M5 19l4-1 10-10-4-4L5 14Z"/></symbol>
  <symbol id="i-more" viewBox="0 0 24 24"><path d="M5 12h.01m7 0h.01m7 0h.01"/></symbol>
  <symbol id="i-clip" viewBox="0 0 24 24"><path d="m9 15 6.5-6.5a2 2 0 0 1 3 3l-8 8a4 4 0 0 1-6-6l8-8"/></symbol>
</svg>
<div id="app">
  <div class="overlay-sidebar" id="sidebar-shade"></div>
  <aside class="sidebar" id="sidebar" aria-label="Menu principal">
    <div class="brand"><span class="brand-mark"><svg class="ico" aria-hidden="true"><use href="#i-logo"/></svg></span><span>Meu Work OS</span></div>
    <nav class="side-nav" aria-label="Visualizações">
      <button type="button" data-switch="board"><svg class="ico" aria-hidden="true"><use href="#i-board"/></svg> Quadro</button>
      <button type="button" data-switch="table"><svg class="ico" aria-hidden="true"><use href="#i-list"/></svg> Lista</button>
      <button type="button" data-switch="calendar"><svg class="ico" aria-hidden="true"><use href="#i-calendar"/></svg> Calendário</button>
    </nav>
    <div class="groups-head"><span>Grupos</span><button type="button" class="icon-btn" data-action="add-group" aria-label="Criar grupo" title="Criar grupo"><svg class="ico" aria-hidden="true"><use href="#i-plus"/></svg></button></div>
    <nav id="side-groups" aria-label="Grupos"></nav>
    <div class="side-footer">
      <button type="button" data-action="import"><svg class="ico" aria-hidden="true"><use href="#i-up"/></svg> Importar backup</button>
      <button type="button" data-action="backup"><svg class="ico" aria-hidden="true"><use href="#i-download"/></svg> Exportar backup</button>
    </div>
  </aside>
  <div class="workspace">
    <header class="topbar">
      <button type="button" class="icon-btn mobile-menu" data-action="mobile-menu" aria-controls="sidebar" aria-expanded="false" aria-label="Abrir menu"><svg class="ico" aria-hidden="true"><use href="#i-menu"/></svg></button>
      <div class="workspace-picker" id="workspace-picker">
        <button type="button" id="workspace-toggle" data-action="workspace-menu" aria-expanded="false" aria-controls="workspace-menu"><span id="workspace-label">Artes e Conteúdos</span><svg class="ico edit-icon" aria-hidden="true"><use href="#i-edit"/></svg></button>
        <div class="workspace-menu hidden" id="workspace-menu">
          <label for="workspace-name">Nome do espaço de trabalho</label>
          <div class="rename-row"><input type="text" maxlength="60" id="workspace-name"><button type="button" class="btn sm" data-action="save-workspace">Salvar</button></div>
        </div>
      </div>
      <button type="button" class="btn cloud-state" id="cloud-pill" data-action="cloud" data-kind="local"><svg class="ico" aria-hidden="true"><use href="#i-sync"/></svg><span id="cloud-text">Modo local</span><span class="status-dot" aria-hidden="true"></span></button>
    </header>
    <main class="content" id="main-scroll">
      <div class="hero">
        <div><h1 id="view-title">Quadro de tarefas</h1><p id="summary"></p></div>
        <button type="button" class="btn primary create-button" data-action="add-task"><svg class="ico" aria-hidden="true"><use href="#i-plus"/></svg> Nova tarefa</button>
      </div>
      <div class="toolbar" aria-label="Filtros de tarefas">
        <div class="header-search"><svg class="ico" aria-hidden="true"><use href="#i-search"/></svg><input id="search" type="search" placeholder="Buscar tarefas" autocomplete="off" aria-label="Buscar tarefas"></div>
        <div class="filters">
          <select id="status-filter" aria-label="Filtrar por status"><option value="">Todos os status</option><option value="pendente">Não iniciado</option><option value="andamento">Em andamento</option><option value="feito">Concluído</option><option value="travado">Bloqueado</option></select>
          <select id="priority-filter" aria-label="Filtrar por prioridade"><option value="">Prioridades</option><option value="alta">Alta</option><option value="media">Média</option><option value="baixa">Baixa</option></select>
          <button type="button" class="btn" id="today-button" data-action="toolbar-today" aria-pressed="false">Hoje</button>
        </div>
      </div>
      <section id="view" class="view-content" aria-labelledby="view-title"></section>
    </main>
  </div>
  <input type="file" accept=".json,application/json" id="import-input" class="hidden">
</div>
<div id="dialog-root"></div>
<div class="toast-stack" id="toasts" role="status" aria-live="polite"></div>
</body>
</html>
