async function importBackup(file){if(!file)return;try{let data=JSON.parse(await file.text());if(!Array.isArray(data)&&!Array.isArray(data.grupos))throw Error('O JSON não tem grupos válidos.');if(!confirm('Importar este backup substituirá os grupos atuais. Continuar?'))return;localStorage.setItem('meu_work_os_v2_backup_pre_importacao',JSON.stringify(state));state=normalizeData(data);persist();render();toast('Backup importado. Os anexos locais dependem do navegador de origem.')}catch(e){toast('Não foi possível importar: '+e.message,true)}finally{$('#import-input').value=''}}
/* IndexedDB: arquivos privados do navegador, sem sincronização entre dispositivos. */
let dbPromise=null;
function openDB(){if(!('indexedDB'in window))return Promise.reject(Error('IndexedDB indisponível'));if(!dbPromise)dbPromise=new Promise((resolve,reject)=>{let r=indexedDB.open('MeuWorkOS_V2_Arquivos',1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains('files'))r.result.createObjectStore('files')};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)});return dbPromise}
async function dbPut(key,blob){let db=await openDB();return new Promise((resolve,reject)=>{let tx=db.transaction('files','readwrite');tx.objectStore('files').put(blob,key);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}
async function dbGet(key){let db=await openDB();return new Promise((resolve,reject)=>{let req=db.transaction('files').objectStore('files').get(key);req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
async function dbDelete(key){try{let db=await openDB();let tx=db.transaction('files','readwrite');tx.objectStore('files').delete(key)}catch(e){console.warn(e)}}
async function localObjectUrl(id){if(generatedUrls.has(id))return generatedUrls.get(id);let blob=await dbGet(id);if(!blob)return '';let u=URL.createObjectURL(blob);generatedUrls.set(id,u);return u}
function attachmentUrl(a){if(a.localizacao==='url')return safeUrl(a.url);if(a.localizacao==='local')return generatedUrls.get(a.id)||'';if(a.localizacao==='cloud')return remoteUrls.get(a.caminho)||'';return ''}
async function getAttachmentUrl(a){if(a.localizacao==='url')return safeUrl(a.url);if(a.localizacao==='local')return localObjectUrl(a.id);if(a.localizacao==='cloud'&&sb&&user){if(remoteUrls.has(a.caminho))return remoteUrls.get(a.caminho);let {data,error}=await sb.storage.from(BUCKET).createSignedUrl(a.caminho,3600);if(error)throw error;remoteUrls.set(a.caminho,data.signedUrl);return data.signedUrl}return ''}
async function hydrateCoverUrls(){let count=state.grupos.flatMap(g=>g.tarefas.filter(filtered)).length;if(count>200)return;let pending=state.grupos.flatMap(g=>g.tarefas.filter(filtered)).flatMap(t=>t.anexos.filter(a=>a.id===t.capa||(!t.capa&&a.tipo.startsWith('image/')))).filter(a=>!attachmentUrl(a));if(!pending.length)return;let unique=[...new Map(pending.map(a=>[a.id,a])).values()];await Promise.allSettled(unique.map(getAttachmentUrl));if(view==='board'&&unique.some(a=>attachmentUrl(a)))renderBoardOnlyCover();}

$$('.kanban-card').forEach(el=>{let t=findTask(el.dataset.taskId)?.task;if(!t)return;let html=coverHtml(t);let old=$(':scope > .card-cover, :scope > .cover-fallback',el);if(old)old.remove();if(html)el.insertAdjacentHTML('afterbegin',html)})}
async function renderAttachments(){let t=modalTask,root=$('#attachments');if(!root||!t)return;let token=t.id;const entries=await Promise.all(t.anexos.map(async a=>{let url='';try{url=await getAttachmentUrl(a)}catch(e){console.warn('Preview indisponível',e)}return {a,url}}));if(!modalTask||modalTask.id!==token||!$('#attachments'))return;root.innerHTML=entries.map(({a,url})=>`<div class="attachment">${url&&a.tipo.startsWith('image/')?`<img class="attachment-preview" src="${esc(url)}" alt="${esc(a.nome)}">`:`<div class="attachment-preview" style="font-size:21px">${a.tipo.startsWith('video/')?'▶':a.tipo==='link'?'↗':'▧'}</div>`}<div class="attachment-meta"><strong title="${esc(a.nome)}">${esc(a.nome)}</strong><small>${a.localizacao==='local'?'Neste navegador':a.localizacao==='cloud'?'Nuvem privada':'Link externo'} ${a.tamanho?' · '+fmtBytes(a.tamanho):''}</small></div><div class="attachment-actions">${url?`<button class="btn ghost sm" data-action="view-attachment" data-id="${esc(a.id)}" title="Visualizar">↗</button>`:''}<button class="btn ghost sm" data-action="remove-attachment" data-id="${esc(a.id)}" title="Remover">×</button></div></div>`).join('')||'<div class="tip">Nenhum anexo ainda.</div>';}
async function uploadMedia(files){if(!modalTask?._existing)return;let valid=[...files].filter(f=>f.type.startsWith('image/')||f.type.startsWith('video/'));if(valid.length!==files.length)toast('Somente imagens e vídeos são aceitos.',true);let id=modalTask.id,oldHtml=$('.dropzone')?.innerHTML;let zone=$('.dropzone');if(zone){zone.classList.add('loading');zone.firstChild.textContent=' Enviando arquivos...'}let successes=0;for(let f of valid){if(f.size>40*1024*1024){toast(`Arquivo ${f.name}: limite de 40 MB.`,true);continue}let a={id:uid(),nome:f.name.slice(0,220),tipo:f.type,localizacao:'local',url:'',caminho:'',tamanho:f.size,criadoEm:stamp()};try{if(sb&&user){a.localizacao='cloud';a.caminho=`${user.id}/${a.id}-${f.name.replace(/[^a-zA-Z0-9._-]/g,'_').slice(-110)}`;let {error}=await sb.storage.from(BUCKET).upload(a.caminho,f,{contentType:f.type,upsert:false});if(error)throw error;}else{await dbPut(a.id,f)}let found=findTask(id);if(!found)throw Error('Cartão não encontrado');found.task.anexos.push(a);found.task.atualizadoEm=stamp();modalTask.anexos.push(a);persist();successes++}catch(e){toast(`Falha em ${f.name}: ${e.message}`,true)}}if(zone&&zone.isConnected){zone.classList.remove('loading');zone.innerHTML=oldHtml||'＋ Adicionar imagem ou vídeo<input id="media-input" class="file-input" type="file" accept="image/*,video/*" multiple>'}if(successes){toast(`${successes} arquivo(s) anexado(s).`);renderAttachments();renderSidebar();renderStats();} }
function addUrl(){let raw=$('#url-input')?.value.trim(),url=safeUrl(raw);if(!url){toast('Insira um link HTTP ou HTTPS válido.',true);return}let found=findTask(modalTask?.id);if(!found)return;let isImg=/\.(png|jpg|jpeg|gif|webp)(\?|$)/i.test(url),isVid=/\.(mp4|webm|mov)(\?|$)/i.test(url);let a={id:uid(),nome:decodeURIComponent(url.split('/').pop().split('?')[0]||'Link').slice(0,160),tipo:isImg?'image/url':isVid?'video/url':'link',localizacao:'url',url,caminho:'',tamanho:0,criadoEm:stamp()};found.task.anexos.push(a);modalTask.anexos.push(a);persist();$('#url-input').value='';renderAttachments();toast('Link adicionado.')}
async function deleteAttachmentFile(a){if(a.localizacao==='local'){await dbDelete(a.id);let url=generatedUrls.get(a.id);if(url)URL.revokeObjectURL(url);generatedUrls.delete(a.id)}else if(a.localizacao==='cloud'&&sb&&user){let {error}=await sb.storage.from(BUCKET).remove([a.caminho]);if(error)toast('Não foi possível remover o arquivo da nuvem.',true);remoteUrls.delete(a.caminho)}}
function removeAttachment(id){let f=findTask(modalTask?.id),a=f?.task.anexos.find(a=>a.id===id);if(!a)return;if(!confirm('Remover este anexo?'))return;deleteAttachmentFile(a);f.task.anexos=f.task.anexos.filter(x=>x.id!==id);modalTask.anexos=modalTask.anexos.filter(x=>x.id!==id);if(f.task.capa===id)f.task.capa='';persist();renderAttachments();toast('Anexo removido.')}
async function viewAttachment(id){let a=modalTask?.anexos.find(x=>x.id===id);if(!a)return;try{let url=await getAttachmentUrl(a);if(!url)throw Error('Arquivo indisponível neste navegador.');if(a.tipo.startsWith('video/')||a.tipo.startsWith('image/')){let current=modalTask.id;let popup=document.createElement('div');popup.className='overlay';popup.style.zIndex='65';popup.id='media-preview';popup.innerHTML=`<div style="position:relative;max-width:96vw;max-height:90vh"><button class="btn primary" data-action="close-preview" style="position:absolute;top:9px;right:9px;z-index:2">✕ Fechar</button>${a.tipo.startsWith('video/')?`<video src="${esc(url)}" controls autoplay playsinline style="max-width:96vw;max-height:86vh;border-radius:10px"></video>`:`<img src="${esc(url)}" alt="${esc(a.nome)}" class="media-large">`}</div>`;document.body.append(popup);popup.addEventListener('click',e=>{if(e.target===popup)popup.remove()})}else window.open(url,'_blank','noopener,noreferrer')}catch(e){toast(e.message,true)}}
/* Supabase: client-side usa apenas chave PUBLICÁVEL. JWT de usuário e RLS protegem o banco e os arquivos. */
function renderCloudStatus(){let label='Modo local',kind='local';if(user){label=remoteConflict?'Conflito na nuvem':saving?'Sincronizando...':dirty?'Alterações pendentes':'Nuvem conectada';kind=remoteConflict?'error':'online'}else if(cloudCfg.url&&cloudCfg.key){label='Nuvem desconectada';kind='error'}$('#cloud-text').textContent=label;$('#cloud-pill').dataset.kind=kind}
function createCloudClient(){if(!cloudCfg.url||!cloudCfg.key)return null;if(!window.supabase?.createClient){toast('Biblioteca Supabase indisponível. Confira sua conexão.',true);return null}try{const u=new URL(cloudCfg.url);if(u.protocol!=='https:')throw Error('URL precisa usar HTTPS');return window.supabase.createClient(u.href.replace(/\/$/,''),cloudCfg.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}})}catch(e){toast('Configuração inválida do Supabase: '+e.message,true);return null}}
async function initCloud(){if(!cloudCfg.url||!cloudCfg.key)return;sb=createCloudClient();if(!sb)return;sb.auth.onAuthStateChange((_event,session)=>{let next=session?.user||null;let changed=(user?.id||'')!==(next?.id||'');user=next;renderCloudStatus();renderSidebar();if(changed&&next)setTimeout(()=>loadCloud(true),0);if(changed&&!next){remoteVersion=null;remoteConflict=false;dirty=false;state={grupos:defaultGroups()};render()}});const {data,error}=await sb.auth.getSession();if(error){console.warn(error);return}if(data.session?.user){user=data.session.user;render();await loadCloud(true)}}
function queueCloudSave(){clearTimeout(saveTimer);saveTimer=setTimeout(()=>saveCloud(),900);renderCloudStatus()}
async function promoteLocalMedia(promoted){for(let g of state.grupos)for(let t of g.tarefas)for(let a of t.anexos){if(a.localizacao!=='local')continue;let blob=await dbGet(a.id);if(!blob)throw Error('Anexo local não encontrado: '+a.nome+'. Remova-o ou recupere-o neste navegador antes de sincronizar.');let caminho=`${user.id}/${a.id}-${a.nome.replace(/[^a-zA-Z0-9._-]/g,'_').slice(-110)}`;let {error}=await sb.storage.from(BUCKET).upload(caminho,blob,{contentType:a.tipo,upsert:false});if(error)throw Error('Não foi possível migrar o anexo '+a.nome+': '+error.message);a.localizacao='cloud';a.caminho=caminho;promoted.push(a.id)}}
async function saveCloud(force=false){if(!sb||!user||saving||remoteConflict)return;if(!dirty&&!force)return;saving=true;renderCloudStatus();let version=remoteVersion,promoted=[];try{await promoteLocalMedia(promoted);let snapshot=JSON.parse(JSON.stringify(state));if(version===null){let {data,error}=await sb.from('workspaces').insert({user_id:user.id,payload:snapshot,version:1}).select('version').single();if(error){if(error.code==='23505'){remoteConflict=true;throw Error('Outro dispositivo criou dados na nuvem. Resolva o conflito.')}throw error}remoteVersion=Number(data.version)}else{let {data,error}=await sb.from('workspaces').update({payload:snapshot,version:version+1,updated_at:stamp()}).eq('user_id',user.id).eq('version',version).select('version');if(error)throw error;if(!data?.length){remoteConflict=true;throw Error('Os dados mudaram em outro dispositivo. Escolha qual versão manter.')}remoteVersion=Number(data[0].version)}localStorage.removeItem(KEY);localStorage.setItem('meu_work_os_v2_legacy_imported','yes');promoted.forEach(id=>dbDelete(id));dirty=JSON.stringify(snapshot)!==JSON.stringify(state);if(dirty)queueCloudSave()}catch(e){dirty=true;toast('Nuvem: '+e.message,true)}finally{saving=false;renderCloudStatus()}}
async function loadCloud(offerChoice=false){if(!sb||!user)return;try{let {data,error}=await sb.from('workspaces').select('payload,version').eq('user_id',user.id).maybeSingle();if(error)throw error;if(!data){remoteVersion=null;remoteConflict=false;dirty=true;await saveCloud();toast('Dados locais enviados à sua nuvem.');return}if(offerChoice&&allTasks().length>0&&JSON.stringify(normalizeData(data.payload))!==JSON.stringify(state)){showCloudChoice(data);return}acceptCloudData(data);toast('Tarefas sincronizadas com a nuvem.')}catch(e){toast('Erro ao carregar nuvem: '+e.message,true)}}
function acceptCloudData(data){localStorage.setItem('meu_work_os_v2_backup_antes_da_nuvem',JSON.stringify(state));state=normalizeData(data.payload);remoteVersion=Number(data.version);remoteConflict=false;dirty=false;localStorage.removeItem(KEY);localStorage.setItem('meu_work_os_v2_legacy_imported','yes');render();}
let pendingCloud=null;
function showCloudChoice(data){pendingCloud=data;dialog(`${dialogHead('Escolher versão das tarefas')}<div class="modal-body"><div class="alert warning">Encontramos tarefas diferentes neste navegador e na nuvem. Para evitar perda de informações, escolha uma versão. Um backup local é criado antes da substituição.</div><div class="field"><strong>Usar dados da nuvem</strong><div class="help">Carrega o que já está no Supabase neste navegador.</div></div><div class="field"><strong>Enviar dados deste navegador</strong><div class="help">Substitui a versão da nuvem pelas tarefas locais. Use somente se tem certeza.</div></div></div><div class="modal-actions" style="justify-content:space-between"><button class="btn" data-action="choose-local">Enviar dados locais</button><button class="btn primary" data-action="choose-cloud">Usar nuvem</button></div>`)}
async function cloudChoose(choice){if(!pendingCloud)return;let data=pendingCloud;pendingCloud=null;if(choice==='cloud'){acceptCloudData(data);closeDialog();toast('Versão da nuvem carregada.')}else{if(!confirm('Substituir os dados da nuvem pelos dados deste navegador?'))return;remoteVersion=Number(data.version);remoteConflict=false;dirty=true;closeDialog();await saveCloud();}}
async function resolveConflict(){if(!sb||!user)return;try{let {data,error}=await sb.from('workspaces').select('payload,version').eq('user_id',user.id).maybeSingle();if(error)throw error;if(data)showCloudChoice(data);else{remoteVersion=null;remoteConflict=false;dirty=true;await saveCloud()}}catch(e){toast(e.message,true)}}
function showCloudDialog(){let configured=!!(cloudCfg.url&&cloudCfg.key);dialog(`${dialogHead('Segurança e sincronização','Supabase Auth + banco de dados + arquivos privados')}<div class="modal-body"><div class="alert">${user?'Sua sessão está autenticada. As tarefas usam políticas por usuário e arquivos privados.':configured?'Configuração detectada. Entre com e-mail e senha para sincronizar com segurança.':'Você pode trabalhar localmente sem senha. Para login seguro e sincronização entre aparelhos, conecte um projeto Supabase.'}</div><div class="field"><label>URL do projeto Supabase</label><input id="sb-url" type="url" placeholder="https://seu-projeto.supabase.co" value="${esc(cloudCfg.url||'')}"></div><div class="field"><label>Chave publicável (anon / publishable)</label><input id="sb-key" autocomplete="off" placeholder="sb_publishable_... ou eyJ..." value="${esc(cloudCfg.key||'')}"><div class="help">Esta é a chave pública do projeto. Nunca utilize service_role, secret keys ou tokens do GitHub aqui.</div></div><button class="btn sm" data-action="save-cloud-config" style="width:100%">Salvar configuração Supabase</button><div class="separator"></div>${configured?`<div class="field"><label>E-mail</label><input type="email" id="auth-email" autocomplete="username" placeholder="seu@email.com" value="${esc(user?.email||'')}"></div><div class="field"><label>Senha</label><input type="password" id="auth-password" autocomplete="current-password" placeholder="Sua senha da conta Supabase"></div><div style="display:flex;flex-wrap:wrap;gap:8px">${user?`<button class="btn" data-action="signout">Sair da conta</button><button class="btn" data-action="sync-now">Sincronizar agora</button>`:`<button class="btn primary" data-action="signin">Entrar</button><button class="btn" data-action="signup">Criar conta</button>`}</div>`:''}<div class="separator"></div><div class="section-title">Migrar dados antigos</div><p class="tip">Os dados da V1 são importados automaticamente quando ainda estiverem disponíveis neste navegador. Também é possível importar o arquivo <code>dados.json</code> ou um backup V1/V2.</p><button class="btn" data-action="import">⇧ Importar arquivo JSON</button><div class="separator"></div><div class="section-title">GitHub Pages</div><p class="tip">O HTML continua hospedável no GitHub Pages. O GitHub não é mais usado como banco de dados nem precisa de um token no navegador. Configure o SQL fornecido junto com esta V2 para habilitar o Supabase.</p></div><div class="modal-actions"><button class="btn" data-action="close-dialog">Fechar</button></div>`)}
async function saveCloudConfig(){let url=$('#sb-url').value.trim(),key=$('#sb-key').value.trim();if(!url&&!key){cloudCfg={};localStorage.removeItem(CLOUD_CFG);sb=null;user=null;remoteVersion=null;closeDialog();render();toast('Configuração de nuvem removida.');return}try{let parsed=new URL(url);if(parsed.protocol!=='https:')throw Error('Use uma URL HTTPS');if(!key||/^sb_secret_|^service_role/i.test(key))throw Error('Use somente a chave publicável / anon');cloudCfg={url:parsed.href.replace(/\/$/,''),key};localStorage.setItem(CLOUD_CFG,JSON.stringify(cloudCfg));sb=createCloudClient();if(!sb)return;closeDialog();await initCloud();showCloudDialog();toast('Configuração salva. Entre com sua conta.')}catch(e){toast(e.message,true)}}
async function loginCloud(signUp){if(!sb)sb=createCloudClient();if(!sb)return;let email=$('#auth-email')?.value.trim(),password=$('#auth-password')?.value;if(!email||!password){toast('Preencha e-mail e senha.',true);return}try{let result=signUp?await sb.auth.signUp({email,password}):await sb.auth.signInWithPassword({email,password});if(result.error)throw result.error;closeDialog();if(signUp&&!result.data.session)toast('Conta criada. Confirme o e-mail antes de entrar.');else toast('Login realizado com sucesso.')}catch(e){toast('Autenticação: '+e.message,true)}}
async function logoutCloud(){if(!sb)return;if(dirty){toast('Há alterações pendentes. Exporte um backup antes de sair.',true);exportBackup();return}let {error}=await sb.auth.signOut();if(error)toast(error.message,true);else{closeDialog();toast('Você saiu da nuvem. As tarefas locais permanecem neste navegador.')}}

document.addEventListener('click',async e=>{let b=e.target.closest('[data-action],[data-switch]');if(!b)return;if(b.dataset.switch){setView(b.dataset.switch);return}let a=b.dataset.action,id=b.dataset.id;switch(a){case 'mobile-menu':$('#sidebar').classList.toggle('open');$('#sidebar-shade').classList.toggle('open');break;case 'add-group':showGroupDialog();break;case 'edit-group':showGroupDialog(id);break;case 'save-group':saveGroup();break;case 'delete-group':deleteGroup();break;case 'add-task':showTaskDialog(null,b.dataset.group||null,b.dataset.date||'');break;case 'open-task':showTaskDialog(id);break;case 'save-task':saveTask();break;case 'delete-task':deleteTask();break;case 'close-dialog':closeDialog();break;case 'check-add':addChecklist();break;case 'check-remove':toggleChecklist(id,false,true);break;case 'remove-attachment':removeAttachment(id);break;case 'view-attachment':viewAttachment(id);break;case 'close-preview':$('#media-preview')?.remove();break;case 'add-url':addUrl();break;case 'backup':exportBackup();break;case 'import':$('#import-input').click();break;case 'cloud':showCloudDialog();break;case 'save-cloud-config':await saveCloudConfig();break;case 'signin':await loginCloud(false);break;case 'signup':await loginCloud(true);break;case 'signout':await logoutCloud();break;case 'sync-now':closeDialog();if(remoteConflict)await resolveConflict();else if(dirty)await saveCloud();else await loadCloud(true);break;case 'choose-cloud':await cloudChoose('cloud');break;case 'choose-local':await cloudChoose('local');break;case 'calendar-prev':month=new Date(month.getFullYear(),month.getMonth()-1,1);renderCalendar();break;case 'calendar-next':month=new Date(month.getFullYear(),month.getMonth()+1,1);renderCalendar();break;case 'calendar-today':month=new Date();renderCalendar();break;case 'calendar-day':if(e.target.closest('.cal-event'))return;showTaskDialog(null,null,b.dataset.date);break;case 'jump-group':{if(view==='calendar')setView('board');closeSidebar();let g=$ document.addEventListener('dragstart',e=>{let c=e.target.closest('.kanban-card');if(!c)return;dragging={taskId:c.dataset.taskId,from:c.dataset.groupId};e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',c.dataset.taskId);c.classList.add('dragging')});
document.addEventListener('dragover',e=>{let col=e.target.closest('[data-drop-group]');if(!col||!dragging)return;e.preventDefault();e.dataTransfer.dropEffect='move';$$('.column.drag-over').forEach(c=>c.classList.remove('drag-over'));col.classList.add('drag-over');let c=e.target.closest('.kanban-card');$$('.kanban-card.over').forEach(el=>el.classList.remove('over'));if(c)c.classList.add('over')});
document.addEventListener('drop',e=>{let col=e.target.closest('[data-drop-group]');if(!col||!dragging)return;e.preventDefault();let g=getGroup(col.dataset.dropGroup),from=getGroup(dragging.from),t=from?.tarefas.find(x=>x.id===dragging.taskId);if(g&&from&&t){let targetCard=e.target.closest('.kanban-card'),targetIndex=targetCard?g.tarefas.findIndex(x=>x.id===targetCard.dataset.taskId):-1;mutate(()=>{from.tarefas=from.tarefas.filter(x=>x.id!==t.id);if(targetIndex<0||targetCard?.dataset.taskId===t.id)g.tarefas.push(t);else{let idx=g.tarefas.findIndex(x=>x.id===targetCard.dataset.taskId);g.tarefas.splice(Math.max(0,idx),0,t)}t.atualizadoEm=stamp()});}dragging=null});
document.addEventListener('dragend',()=>{dragging=null;$$('.dragging,.drag-over,.over').forEach(el=>el.classList.remove('dragging','drag-over','over'))});
document.addEventListener('click',e=>{let c=e.target.closest('.kanban-card');if(c&&!e.target.closest('[data-action]')&&!dragging)showTaskDialog(c.dataset.taskId)});
window.addEventListener('beforeunload',e=>{for(let u of generatedUrls.values())URL.revokeObjectURL(u);if(dirty){e.preventDefault();e.returnValue=''}});
render();if(hasPrior&&!localStorage.getItem(KEY))persist({skipCloud:true});
window.addEventListener('load',()=>{if(cloudCfg.url&&cloudCfg.key)initCloud()});
})();
</script>
</body>
